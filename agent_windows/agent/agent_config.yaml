agent:
  hostname: ""  
  os: ""        

server:
  address: "localhost"
  port: "5000"

collectors:
  # Windows Event Log (Журнал безопасности)
  winevent:
    enabled: true
    channel: "Security"
    eventid: "*"  # * = все события, можно указать конкретный ID
    # Примеры:
    # "*[System[(EventID=4624)]]" - только событие 4624 (успешный вход)
    # "*[System[(EventID=4625)]]" - только событие 4625 (неудачный вход)
    # "*" - все события из канала Security
  
  # Sysmon (требует установки Sysmon)
  sysmon:
    enabled: true
    channel: "Microsoft-Windows-Sysmon/Operational"
    eventid: "*"  # * = все события
    # Примеры:
    # "*[System[(EventID=1)]]"  - Process Creation
    # "*[System[(EventID=3)]]"  - Network Connection
    # "*[System[(EventID=11)]]" - File Created

# ============================================================================
# ПРИМЕЧАНИЯ
# ============================================================================
# 
# 1. Для работы сборщика Sysmon необходимо установить Sysmon:
#    https://docs.microsoft.com/en-us/sysinternals/downloads/sysmon
#    
# 2. Агент должен запускаться с правами Администратора
#    
# 3. Адрес сервера должен быть доступен по сети
#    
# 4. Указанный порт должен быть открыт на SIEM сервере
# 
# ============================================================================