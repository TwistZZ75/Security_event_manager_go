services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:alpine
    container_name: siem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./migrations/migration.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./migrations/testdata.sql:/docker-entrypoint-initdb.d/02-testdata.sql:ro
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: siem_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  siem-server:
    build:
      context: ./siem-server
      dockerfile: Dockerfile
    container_name: siem_server
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy  
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"   # HTTP REST API
      - "5000:5000" # gRPC (для агентов и клиентов логов)


  # ── React-фронтенд ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/siem_dashboard
      dockerfile: Dockerfile
    container_name: siem_frontend
    restart: unless-stopped
    depends_on:
      - siem-server
    ports:
      - "3000:80"

volumes:
  postgres_data: